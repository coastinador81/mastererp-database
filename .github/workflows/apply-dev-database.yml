name: Apply DEV database model

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'schema/**'
      - 'seeds/**'
      - 'tests/**'
      - 'migrations/lambda/**'
      - '.github/workflows/apply-dev-database.yml'

permissions:
  contents: read

concurrency:
  group: mastererp-dev-database
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MASTERERP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MASTERERP_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1
      - name: Invoke DEV database migrator
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name mastererp-dev-database-migrator \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            --cli-read-timeout 310 \
            response.json > metadata.json
          test "$(jq -r '.FunctionError // empty' metadata.json)" = ''
          jq -e '.status == "succeeded" and .tests == "passed"' response.json >/dev/null
          jq '{status,files_applied,schemas,table_count,tests,correlation_id}' response.json
          echo 'Schemas:'
          jq -r '.schemas[]' response.json
          echo 'Table count:'
          jq -r '.table_count' response.json
