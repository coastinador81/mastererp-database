name: Apply DEV database model

on:
  workflow_dispatch:
    inputs:
      apply_model:
        description: Apply the reviewed customer administration batch after successful preflight
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - 'schema/**'
      - 'seeds/**'
      - 'tests/**'
      - 'migrations/lambda/**'
      - 'scripts/package_migrator.py'
      - '.github/workflows/apply-dev-database.yml'
      - '.github/workflows/deploy-migrator.yml'

permissions:
  contents: read

concurrency:
  group: mastererp-dev-database
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.classify.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide whether SQL/model validation changed
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/database_apply_required.py
  deploy-migrator:
    needs: changes
    uses: ./.github/workflows/deploy-migrator.yml
    secrets: inherit
  apply:
    needs: [changes, deploy-migrator]
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MASTERERP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MASTERERP_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1
      - name: Invoke DEV database migrator
        shell: bash
        env:
          APPLY_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_model }}
        run: |
          set -euo pipefail
          payload='{"action":"validate_customer_admin_candidate"}'
          if [ "$APPLY_MODEL" = 'true' ]; then payload='{"action":"apply_model"}'; fi
          aws lambda invoke \
            --function-name mastererp-dev-database-migrator \
            --cli-binary-format raw-in-base64-out \
            --payload "$payload" \
            --cli-read-timeout 310 \
            response.json > metadata.json
          test "$(jq -r '.FunctionError // empty' metadata.json)" = ''
          jq -e '.status == "succeeded" and .tests == "passed"' response.json >/dev/null
          jq '{status,files_applied,schemas,table_count,tests,correlation_id}' response.json
          echo 'Schemas:'
          jq -r '.schemas[]' response.json
          echo 'Table count:'
          jq -r '.table_count' response.json
