name: Deploy DEV migrator
on:
  workflow_call:
    secrets:
      MASTERERP_AWS_ACCESS_KEY_ID:
        required: true
      MASTERERP_AWS_SECRET_ACCESS_KEY:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MASTERERP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MASTERERP_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1
      - name: Package reviewed commit and update official DEV migrator
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 277352717693
          name=mastererp-dev-database-migrator
          aws lambda get-function-configuration --function-name "$name" > before.json
          jq -e '.Runtime == "python3.12" and .State == "Active" and .Environment.Variables.ENVIRONMENT == "dev" and .Environment.Variables.DB_NAME == "mastererp"' before.json >/dev/null
          pip install --no-compile --target package -r migrations/lambda/requirements-package.txt
          python scripts/package_migrator.py function.zip --dependencies package
          expected=$(openssl dgst -sha256 -binary function.zip | openssl base64 -A)
          revision=$(jq -r '.RevisionId' before.json)
          aws lambda update-function-code --function-name "$name" --revision-id "$revision" --zip-file fileb://function.zip > updated.json
          aws lambda wait function-updated-v2 --function-name "$name"
          aws lambda get-function-configuration --function-name "$name" > after.json
          jq -e --arg sha "$expected" '.State == "Active" and .LastUpdateStatus == "Successful" and .CodeSha256 == $sha' after.json >/dev/null
          jq -e --slurpfile old before.json '.Role == $old[0].Role and .VpcConfig == $old[0].VpcConfig and .Environment == $old[0].Environment' after.json >/dev/null
          echo "Source commit: $GITHUB_SHA"
          jq '{FunctionArn,CodeSha256,State,LastUpdateStatus,RevisionId}' after.json
